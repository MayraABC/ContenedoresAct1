version: '1.2'

services:

  db:
    image: postgres:15.17-alpine3.22
    container_name: fintech_db
    environment:
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech_pass123
      POSTGRES_DB: fintech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintech_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        # Imagen base: Node.js 18 con Alpine Linux
        FROM node:18-alpine

        # Carpeta de trabajo dentro del contenedor
        WORKDIR /app

        # Copiamos primero los archivos de dependencias
        COPY package.json ./

        # Instalamos solo las dependencias de producción
        RUN npm install --production

        # Copiamos el resto del código fuente
        COPY . .

        # Puerto en el que correrá la aplicación
        EXPOSE 3001

        # Comando para arrancar la aplicación
        CMD ["node", "server.js"]
    container_name: fintech_backend
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: fintech_user
      DB_PASSWORD: fintech_pass123
      DB_NAME: fintech_db
    networks:
      - fintech_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        # ---- PASO 1: Construir ----
        # Imagen base con Node.js 18 Alpine; alias "build" para la etapa de construcción
        FROM node:18-alpine AS build

        # Carpeta de trabajo dentro del contenedor
        WORKDIR /app

        # Copiamos primero los archivos de dependencias
        COPY package.json ./

        # Instalamos las dependencias
        RUN npm install

        # Copiamos el resto del código fuente
        COPY . .

        # Generamos los archivos estáticos listos para producción (carpeta /build)
        RUN npm run build

        # ---- PASO 2: Servir ----
        # Usamos Nginx para servir los archivos estáticos generados
        FROM nginx:alpine

        # Copiamos los archivos del build al directorio que sirve Nginx
        COPY --from=build /app/build /usr/share/nginx/html

        # Puerto por defecto de Nginx
        EXPOSE 80

        # Nginx arranca automáticamente al iniciar el contenedor
        CMD ["nginx", "-g", "daemon off;"]
    container_name: fintech_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fintech_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fintech_net:
    driver: bridge
